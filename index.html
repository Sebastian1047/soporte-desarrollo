<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soporte de Aplicaciones</title>
  <link rel="stylesheet" href="styles.css?v=20261007-2" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">FL</div>
        <div>
          <strong>FlowerLogix</strong>
          <span>Desarrollo de aplicaciones</span>
        </div>
      </div>

      <div class="sidebar-section">DESARROLLO</div>
      <nav id="sidebarMenu"></nav>
    </aside>

    <section class="workspace">
      <header class="topbar">

          <h1>Soporte de Aplicaciones</h1>

          <label>

            <select id="userSelector">

          <div class="user-info">
            <strong id="userName"></strong>
            <span id="userRole" class="role-badge"></span>
          </div>
        </div>
      </header>

      <main id="app" class="main-card"></main>
    </section>
  </div>

  <script src="app.js?v=20261007-3"></script>

</html>
