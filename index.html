<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Módulo de gestión de soporte y solicitudes internas" />
  <title>FlowerLogix · Soporte de Sistemas</title>
  <link rel="stylesheet" href="./styles.css?v=1.0.0" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">FL</div>
        <div class="brand-copy">
          <strong>FlowerLogix</strong>
          <span>Soporte de sistemas</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Navegación principal">
        <div class="nav-group">
          <div class="nav-heading">SOPORTE <span>⌄</span></div>
          <button class="nav-item active" data-view="dashboard">Panel de soporte</button>
          <button class="nav-item" data-view="new-ticket">Nueva solicitud</button>
          <button class="nav-item" data-view="my-tickets">Mis solicitudes</button>
        </div>

        <div class="nav-group">
          <div class="nav-heading">SEGUIMIENTO <span>⌄</span></div>
          <button class="nav-item" data-view="all-tickets">Bandeja de solicitudes</button>
          <button class="nav-item" data-view="activity">Actividad reciente</button>
        </div>

        <div class="nav-group">
          <div class="nav-heading">ADMINISTRACIÓN <span>⌄</span></div>
          <button class="nav-item" data-view="settings">Configuración</button>
        </div>
      </nav>
    </aside>

    <div class="workspace">
      <header class="hero">
        <div class="hero-copy">
          <div class="eyebrow">ADMINISTRACIÓN / SOPORTE</div>
          <h1>Soporte de Sistemas</h1>
          <p>Gestión, seguimiento y control de solicitudes internas.</p>
        </div>

        <div class="session-card">
          <div class="login-row">
            <input id="sessionUser" type="text" value="usuario.demo" aria-label="Usuario" />
            <input type="password" value="clave" aria-label="Clave" />
            <button class="btn btn-primary btn-compact" type="button">Entrar</button>
          </div>
          <div class="session-grid">
            <label>
              <span>Sede</span>
              <select id="sessionSite">
                <option>JL</option>
                <option>ME</option>
                <option>BO</option>
              </select>
            </label>
            <button class="btn btn-primary session-exit" type="button">Salir</button>
          </div>
          <div class="session-user">USUARIO DEMO · Administrador</div>
        </div>
      </header>

      <div class="module-tabs" role="tablist" aria-label="Vistas de soporte">
        <button class="tab-pill active" data-view="dashboard">📊 Panel</button>
        <button class="tab-pill" data-view="new-ticket">＋ Nueva solicitud</button>
        <button class="tab-pill" data-view="my-tickets">☑ Mis solicitudes</button>
      </div>

      <main id="app" class="main-card" aria-live="polite"></main>
    </div>
  </div>

  <script src="./app.js?v=1.0.0"></script>
</body>
</html>
