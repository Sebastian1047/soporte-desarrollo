<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="support-build" content="v3-inline-20261006" />
  <title>Soporte Desarrollo</title>
  <style>
:root{
  --support-green-950:#0b261c;
  --support-green-900:#102f24;
  --support-green-800:#174a36;
  --support-green-700:#1e7a4f;
  --support-green-100:#dff2e8;
  --support-green-050:#f1f8f4;
  --support-bg:#eef5f0;
  --support-surface:#ffffff;
  --support-border:#d4e2d9;
  --support-text:#0a1712;
  --support-muted:#5f7469;
  --support-danger:#a93f3f;
  --support-warning:#9c6a13;
  --support-radius-lg:18px;
  --support-radius-md:14px;
  --support-radius-sm:10px;
  --support-shadow:0 18px 36px rgba(16,47,36,.08);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--support-text);background:var(--support-bg)}
button,input,select,textarea{font:inherit}

.support-shell{min-height:100vh;display:grid;grid-template-columns:188px minmax(0,1fr);background:linear-gradient(135deg,#f8fbf9 0%,#edf5f0 55%,#e8f2ec 100%)}
.support-sidebar{background:var(--support-green-950);padding:14px 14px 20px;color:#fff;display:flex;flex-direction:column;gap:7px}
.support-brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.support-brand-mark{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#dff2e8;color:var(--support-green-900);font-size:.8rem;font-weight:900}
.support-brand strong{display:block;font-size:.82rem}
.support-brand span{display:block;font-size:.62rem;color:#c8d8d0;margin-top:2px}
.support-section-label{font-size:.56rem;letter-spacing:.12em;color:#7fa08e;font-weight:800;margin:8px 2px 2px}
.support-nav-link{width:100%;border:1px solid #234235;background:transparent;color:#f7fbf8;padding:10px 10px;border-radius:12px;text-align:left;cursor:pointer;font-size:.78rem;transition:.18s ease}
.support-nav-link:hover{background:#16382a}
.support-nav-link.active{background:#dff2e8;color:#16382a;border-color:#dff2e8}

.support-workspace{min-width:0;padding:14px}
.support-topbar{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;min-height:160px}
.support-eyebrow{font-size:.68rem;letter-spacing:.16em;color:#0f6b43;font-weight:900;margin-bottom:4px}
.support-topbar h1{font-size:2rem;line-height:1.05;margin:0 0 6px;font-weight:900}
.support-topbar p{margin:0;color:var(--support-muted);font-size:.82rem}
.support-user-card{width:315px;background:rgba(255,255,255,.9);border:1px solid var(--support-border);border-radius:18px;padding:14px;box-shadow:var(--support-shadow)}
.support-user-row{display:flex;justify-content:space-between;gap:14px;align-items:center}
.support-user-label{display:block;color:var(--support-muted);font-size:.64rem;margin-bottom:3px}
.support-user-row strong{font-size:.82rem}
.support-role-pill{background:var(--support-green-700);color:#fff;padding:8px 13px;border-radius:999px;font-size:.72rem;font-weight:800}
.support-user-meta{display:block;margin-top:10px;font-size:.66rem;color:var(--support-muted)}

.support-module{background:rgba(255,255,255,.92);border:1px solid var(--support-border);border-radius:var(--support-radius-lg);padding:14px;box-shadow:var(--support-shadow);min-height:calc(100vh - 195px)}
.support-page-header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--support-border);margin-bottom:14px}
.support-page-kicker{font-size:.63rem;letter-spacing:.12em;color:#0f6b43;font-weight:900;margin-bottom:4px}
.support-page-header h2{font-size:1.6rem;margin:0 0 5px;line-height:1.1}
.support-page-header p{margin:0;color:var(--support-muted);font-size:.76rem}

.support-tabs{display:flex;gap:8px;margin-bottom:14px}
.support-tab{border:1px solid var(--support-border);background:#fff;color:#33483d;padding:6px 12px;border-radius:999px;font-size:.7rem;font-weight:800}
.support-tab.active{background:var(--support-green-700);color:#fff;border-color:var(--support-green-700)}

.support-toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:#fbfdfc;border:1px solid var(--support-border);padding:10px;border-radius:14px;margin-bottom:12px}
.support-toolbar .form-group{margin:0;min-width:170px}
.support-toolbar .form-group.grow{flex:1;min-width:250px}

.support-button{border:0;border-radius:999px;padding:10px 16px;cursor:pointer;font-size:.76rem;font-weight:800}
.support-button.primary{background:var(--support-green-700);color:#fff}
.support-button.primary:hover{background:#176840}
.support-button.secondary{background:#eef5f1;color:#244236;border:1px solid var(--support-border)}
.support-button.danger{background:#f9ecec;color:#873737;border:1px solid #e8caca}

.support-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.support-metric{background:#fff;border:1px solid var(--support-border);border-radius:14px;padding:12px}
.support-metric span{display:block;color:var(--support-muted);font-size:.64rem;margin-bottom:4px}
.support-metric strong{font-size:1rem}

.form-card,.detail-card,.dev-card{background:#fff;border:1px solid var(--support-border);border-radius:14px;padding:14px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.68rem;color:#4c6257;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea,.support-filter{
  width:100%;border:1px solid #cddbd2;background:#fff;border-radius:11px;padding:9px 10px;color:var(--support-text);outline:none
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus,.support-filter:focus{border-color:#6ca887;box-shadow:0 0 0 3px rgba(30,122,79,.08)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:.74rem;margin:10px 0 14px}
.form-actions{display:flex;justify-content:flex-end;margin-top:12px}

.support-table-wrap{overflow:auto}
.support-table{width:100%;border-collapse:collapse;font-size:.72rem}
.support-table th{font-size:.62rem;color:#41574b;font-weight:800;text-align:left;padding:9px 7px;border-bottom:1px solid var(--support-border)}
.support-table td{padding:10px 7px;border-bottom:1px solid #e0e9e4;vertical-align:middle}
.support-table tr[data-ticket-id]{cursor:pointer}
.support-table tr[data-ticket-id]:hover{background:#f3f8f5}
.support-ticket-title{font-weight:700}
.support-muted{color:var(--support-muted)}

.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:.61rem;font-weight:800}
.badge-low{background:#e3f5e8;color:#2b6a3d}
.badge-medium{background:#f9f1d9;color:#896410}
.badge-high{background:#faeadc;color:#91531d}
.badge-critical{background:#f7dddd;color:#923a3a}
.badge-confidential{background:#e9eef7;color:#445979}
.status-pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#edf4ef;color:#2f5d45;font-size:.61rem;font-weight:800}

.ticket-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.detail-field{border:1px solid var(--support-border);border-radius:12px;padding:10px;background:#fbfdfc}
.detail-field strong{display:block;font-size:.62rem;color:var(--support-muted);margin-bottom:4px}
.detail-field p{margin:0;font-size:.78rem}
.divider{border:0;border-top:1px solid var(--support-border);margin:14px 0}
.small{font-size:.68rem;color:var(--support-muted)}
.empty-state{padding:26px;text-align:center;color:var(--support-muted);border:1px dashed var(--support-border);border-radius:14px}
.dev-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.dev-box{border:1px solid var(--support-border);border-radius:12px;padding:10px;background:#fbfdfc}
.dev-box p{margin:5px 0 0;color:var(--support-muted);font-size:.72rem}

@media(max-width:900px){
  .support-shell{grid-template-columns:1fr}
  .support-sidebar{position:static;display:flex;flex-direction:row;overflow:auto;align-items:center}
  .support-brand,.support-section-label{display:none}
  .support-nav-link{width:auto;white-space:nowrap}
  .support-topbar{min-height:auto;margin-bottom:12px}
  .support-user-card{display:none}
  .support-module{min-height:auto}
}
@media(max-width:700px){
  .support-workspace{padding:10px}
  .support-topbar h1{font-size:1.55rem}
  .support-topbar{display:block}
  .support-metrics,.form-row,.ticket-detail-grid,.dev-grid{grid-template-columns:1fr}
  .support-page-header{flex-direction:column}
}
  </style>
</head>
<body>
  <div class="support-shell">
    <aside class="support-sidebar">
      <div class="support-brand">
        <div class="support-brand-mark">SD</div>
        <div>
          <strong>Soporte</strong>
          <span>Gestión de solicitudes</span>
        </div>
      </div>

      <div class="support-section-label">SOPORTE</div>
      <button class="support-nav-link active" data-view="dashboard">Panel principal</button>
      <button class="support-nav-link" data-view="new-ticket">Nueva solicitud</button>
      <button class="support-nav-link" data-view="tickets">Mis solicitudes</button>

      <div class="support-section-label">ADMINISTRACIÓN</div>
      <button class="support-nav-link" data-view="developer">Configuración</button>
    </aside>

    <section class="support-workspace">
      <header class="support-topbar">
        <div>
          <div class="support-eyebrow">SOPORTE / SOLICITUDES</div>
          <h1>Gestión de Soporte</h1>
          <p>Registro, seguimiento y control de solicitudes internas.</p>
        </div>

        <div class="support-user-card">
          <div class="support-user-row">
            <div>
              <span class="support-user-label">Usuario</span>
              <strong id="currentUser">Usuario Demo</strong>
            </div>
            <span class="support-role-pill">Administrador</span>
          </div>
          <span class="support-user-meta">Sede principal · Mesa de ayuda</span>
        </div>
      </header>

      <main id="app" class="support-module"></main>
    </section>
  </div>

  <script>
const STORAGE_KEY = 'ticketSupportHtmlTickets';

const seedTickets = [
  {
    id: 1001,
    title: 'Falla en acceso a servidor de base de datos',
    category: 'Soporte Técnico / TI',
    urgency: 'alta',
    confidential: true,
    description: 'Se presenta lentitud intermitente en las consultas hacia SQL Server.',
    status: 'En Proceso',
    createdAt: new Date().toISOString(),
    createdBy: 'Usuario Demo'
  },
  {
    id: 1002,
    title: 'Solicitud de monitor secundario',
    category: 'Solicitud de Hardware / Equipo',
    urgency: 'media',
    confidential: false,
    description: 'Se requiere un monitor adicional para labores de soporte.',
    status: 'Pendiente',
    createdAt: new Date(Date.now() - 86400000).toISOString(),
    createdBy: 'Usuario Demo'
  }
];

function loadTickets() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(seedTickets));
    return [...seedTickets];
  }
  try { return JSON.parse(raw); } catch { return [...seedTickets]; }
}

function saveTickets(items) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

let tickets = loadTickets();
let currentView = 'dashboard';

const app = document.getElementById('app');
const navButtons = [...document.querySelectorAll('.support-nav-link')];

navButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    currentView = btn.dataset.view;
    setActiveNav(currentView);
    render();
  });
});

function setActiveNav(view) {
  navButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
}

function categoryLabel(value) {
  const map = {
    it_support: 'Soporte Técnico / TI',
    hardware: 'Solicitud de Hardware / Equipo',
    software_access: 'Acceso a Software / Permisos',
    infrastructure: 'Redes e Infraestructura'
  };
  return map[value] || value;
}

function urgencyLabel(value) {
  return { baja:'Baja', media:'Media', alta:'Alta', critica:'Crítica' }[value] || value;
}

function urgencyClass(value) {
  return { baja:'badge-low', media:'badge-medium', alta:'badge-high', critica:'badge-critical' }[value] || 'badge-medium';
}

function pageHeader(kicker, title, subtitle, action = '') {
  return `
    <div class="support-page-header">
      <div>
        <div class="support-page-kicker">${kicker}</div>
        <h2>${title}</h2>
        <p>${subtitle}</p>
      </div>
      ${action}
    </div>
  `;
}

function render() {
  if (currentView === 'dashboard') renderDashboard();
  else if (currentView === 'new-ticket') renderNewTicket();
  else if (currentView === 'tickets') renderTicketsPage();
  else if (currentView === 'developer') renderDeveloper();
}

function renderDashboard() {
  const total = tickets.length;
  const attention = tickets.filter(t => ['Pendiente','En Proceso'].includes(t.status)).length;
  const critical = tickets.filter(t => t.urgency === 'critica').length;

  app.innerHTML = `
    ${pageHeader(
      'SOPORTE → PANEL PRINCIPAL',
      'Solicitudes de Soporte',
      'Resumen general de tickets registrados y solicitudes que requieren atención.',
      '<button class="support-button primary" id="goNew">Nueva solicitud</button>'
    )}

    <div class="support-tabs">
      <span class="support-tab active">Solicitudes</span>
      <span class="support-tab">Indicadores</span>
    </div>

    <div class="support-toolbar">
      <div class="form-group grow">
        <label>Buscar solicitud</label>
        <input id="ticketSearch" class="support-filter" placeholder="ID, asunto o categoría" />
      </div>
      <div class="form-group">
        <label>Urgencia</label>
        <select id="urgencyFilter" class="support-filter">
          <option value="all">Todas</option>
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
          <option value="critica">Crítica</option>
        </select>
      </div>
    </div>

    <div class="support-metrics">
      <div class="support-metric"><span>Solicitudes registradas</span><strong>${total}</strong></div>
      <div class="support-metric"><span>En atención</span><strong>${attention}</strong></div>
      <div class="support-metric"><span>Urgencia crítica</span><strong>${critical}</strong></div>
    </div>

    <div id="ticketList"></div>
  `;

  document.getElementById('goNew').onclick = () => {
    currentView = 'new-ticket';
    setActiveNav(currentView);
    render();
  };

  bindTicketFilters();
}

function bindTicketFilters() {
  const search = document.getElementById('ticketSearch');
  const urgency = document.getElementById('urgencyFilter');

  const draw = () => {
    const term = search.value.trim().toLowerCase();
    const urg = urgency.value;
    const filtered = tickets.filter(t => {
      const text = `${t.id} ${t.title} ${t.category}`.toLowerCase();
      return text.includes(term) && (urg === 'all' || t.urgency === urg);
    });
    renderTicketTable(filtered);
  };

  search.addEventListener('input', draw);
  urgency.addEventListener('change', draw);
  draw();
}

function renderTicketTable(list) {
  const target = document.getElementById('ticketList');
  if (!list.length) {
    target.innerHTML = '<div class="empty-state">No se encontraron solicitudes con esos criterios.</div>';
    return;
  }

  target.innerHTML = `
    <div class="support-table-wrap">
      <table class="support-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Solicitud</th>
            <th>Categoría</th>
            <th>Urgencia</th>
            <th>Estado</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(t => `
            <tr data-ticket-id="${t.id}">
              <td>#${t.id}</td>
              <td>
                <div class="support-ticket-title">${escapeHtml(t.title)}</div>
                ${t.confidential ? '<span class="badge badge-confidential">Confidencial</span>' : ''}
              </td>
              <td>${escapeHtml(t.category)}</td>
              <td><span class="badge ${urgencyClass(t.urgency)}">${urgencyLabel(t.urgency)}</span></td>
              <td><span class="status-pill">${escapeHtml(t.status)}</span></td>
              <td>${new Date(t.createdAt).toLocaleDateString('es-CO')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  target.querySelectorAll('[data-ticket-id]').forEach(row => {
    row.addEventListener('click', () => renderTicketDetail(Number(row.dataset.ticketId)));
  });
}

function renderNewTicket() {
  app.innerHTML = `
    ${pageHeader(
      'SOPORTE → NUEVA SOLICITUD',
      'Registrar solicitud',
      'Complete los datos requeridos para enviar la solicitud a la mesa de soporte.',
      '<button class="support-button secondary" id="backDashboard">Volver</button>'
    )}

    <form id="ticketForm" class="form-card">
      <div class="form-group">
        <label>Asunto / título *</label>
        <input name="title" required placeholder="Ej: Falla en acceso a servidor de base de datos" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Categoría *</label>
          <select name="category" id="category">
            <option value="it_support">Soporte Técnico / TI</option>
            <option value="hardware">Solicitud de Hardware / Equipo</option>
            <option value="software_access">Acceso a Software / Permisos</option>
            <option value="infrastructure">Redes e Infraestructura</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nivel de urgencia *</label>
          <select name="urgency">
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
            <option value="critica">Crítica</option>
          </select>
        </div>
      </div>

      <div id="dynamicFields"></div>

      <label class="checkbox-row">
        <input type="checkbox" name="confidential" />
        Marcar esta solicitud como confidencial
      </label>

      <div class="form-group">
        <label>Descripción detallada *</label>
        <textarea name="description" rows="5" required placeholder="Describe el problema o requerimiento..."></textarea>
      </div>

      <div class="form-group">
        <label>Adjuntar evidencias</label>
        <input type="file" id="attachments" multiple />
        <div class="small">En esta versión estática se conserva el nombre del archivo.</div>
      </div>

      <div class="form-actions">
        <button class="support-button primary" type="submit">Crear solicitud</button>
      </div>
    </form>
  `;

  document.getElementById('backDashboard').onclick = () => {
    currentView = 'dashboard';
    setActiveNav(currentView);
    render();
  };

  const category = document.getElementById('category');
  const dynamic = document.getElementById('dynamicFields');

  const refreshDynamic = () => {
    if (category.value === 'hardware') {
      dynamic.innerHTML = '<div class="form-group"><label>Tipo de equipo requerido</label><input name="equipmentType" placeholder="Ej: Laptop i7, monitor secundario" /></div>';
    } else if (category.value === 'software_access') {
      dynamic.innerHTML = '<div class="form-group"><label>Sistema o base de datos</label><input name="systemName" placeholder="Ej: Portal ERP, SQL Server Staging" /></div>';
    } else {
      dynamic.innerHTML = '';
    }
  };

  category.addEventListener('change', refreshDynamic);
  refreshDynamic();

  document.getElementById('ticketForm').addEventListener('submit', e => {
    e.preventDefault();
    const form = new FormData(e.target);
    const files = [...document.getElementById('attachments').files].map(f => f.name);
    const nextId = tickets.length ? Math.max(...tickets.map(t => Number(t.id))) + 1 : 1001;

    tickets.unshift({
      id: nextId,
      title: form.get('title'),
      category: categoryLabel(form.get('category')),
      urgency: form.get('urgency'),
      confidential: form.get('confidential') === 'on',
      description: form.get('description'),
      status: 'Pendiente',
      createdAt: new Date().toISOString(),
      createdBy: 'Usuario Demo',
      customField: form.get('equipmentType') || form.get('systemName') || '',
      attachments: files
    });

    saveTickets(tickets);
    currentView = 'dashboard';
    setActiveNav(currentView);
    render();
  });
}

function renderTicketsPage() {
  app.innerHTML = `
    ${pageHeader(
      'SOPORTE → MIS SOLICITUDES',
      'Mis solicitudes',
      'Consulta el histórico de solicitudes creadas desde este módulo.'
    )}

    <div class="support-toolbar">
      <div class="form-group grow">
        <label>Buscar solicitud</label>
        <input id="ticketSearch" class="support-filter" placeholder="ID, asunto o categoría" />
      </div>
      <div class="form-group">
        <label>Urgencia</label>
        <select id="urgencyFilter" class="support-filter">
          <option value="all">Todas</option>
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
          <option value="critica">Crítica</option>
        </select>
      </div>
    </div>

    <div id="ticketList"></div>
  `;

  bindTicketFilters();
}

function renderTicketDetail(id) {
  const t = tickets.find(x => Number(x.id) === Number(id));
  if (!t) return;

  app.innerHTML = `
    ${pageHeader(
      'SOPORTE → DETALLE',
      `Solicitud #${t.id}`,
      'Información completa y trazabilidad básica de la solicitud.',
      '<button class="support-button secondary" id="backTickets">Volver</button>'
    )}

    <div class="detail-card">
      <div class="support-page-header">
        <div>
          <div class="support-ticket-title">${escapeHtml(t.title)}</div>
          <span class="status-pill">${escapeHtml(t.status)}</span>
        </div>
        ${t.confidential ? '<span class="badge badge-confidential">Confidencial</span>' : ''}
      </div>

      <div class="ticket-detail-grid">
        <div class="detail-field"><strong>Categoría</strong><p>${escapeHtml(t.category)}</p></div>
        <div class="detail-field"><strong>Urgencia</strong><p>${urgencyLabel(t.urgency)}</p></div>
        <div class="detail-field"><strong>Creado por</strong><p>${escapeHtml(t.createdBy || 'Usuario Demo')}</p></div>
        <div class="detail-field"><strong>Fecha de creación</strong><p>${new Date(t.createdAt).toLocaleString('es-CO')}</p></div>
      </div>

      <hr class="divider" />
      <h4>Descripción</h4>
      <p class="support-muted">${escapeHtml(t.description)}</p>

      ${t.customField ? `<hr class="divider" /><h4>Información adicional</h4><p class="support-muted">${escapeHtml(t.customField)}</p>` : ''}

      <hr class="divider" />
      <h4>Archivos adjuntos</h4>
      ${t.attachments?.length
        ? `<ul>${t.attachments.map(f => `<li>${escapeHtml(f)}</li>`).join('')}</ul>`
        : '<p class="small">No hay archivos adjuntos.</p>'
      }
    </div>
  `;

  document.getElementById('backTickets').onclick = () => {
    currentView = 'dashboard';
    setActiveNav(currentView);
    render();
  };
}

function renderDeveloper() {
  app.innerHTML = `
    ${pageHeader(
      'SOPORTE → CONFIGURACIÓN',
      'Configuración del módulo',
      'Información técnica de la versión estática preparada para integrarse a una aplicación mayor.'
    )}

    <div class="dev-card">
      <div class="dev-grid">
        <div class="dev-box"><strong>Frontend</strong><p>HTML5 + CSS3 + JavaScript puro</p></div>
        <div class="dev-box"><strong>Persistencia</strong><p>localStorage del navegador</p></div>
        <div class="dev-box"><strong>Integración</strong><p>Estilos encapsulados con prefijo support-</p></div>
        <div class="dev-box"><strong>Hosting</strong><p>Compatible con GitHub Pages</p></div>
      </div>

      <hr class="divider" />
      <button class="support-button danger" id="resetData">Restablecer datos de prueba</button>
    </div>
  `;

  document.getElementById('resetData').onclick = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(seedTickets));
    tickets = loadTickets();
    alert('Datos de prueba restablecidos.');
    renderDeveloper();
  };
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

render();
  </script>
</body>
</html>
